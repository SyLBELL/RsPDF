[package]
name = "pdf-studio"
version = "0.1.0"
edition = "2021"
description = "PDF Studio - editor PDF all-in-one untuk Windows 11 (Rust + egui)"

[lib]
name = "pdf_studio"
path = "src/lib.rs"

[[bin]]
name = "pdf-studio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
lopdf = "0.47"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pdfium-render = "0.8"
similar = "2"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
